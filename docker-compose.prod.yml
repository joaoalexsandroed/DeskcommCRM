# DeskcommCRM — stack de produção self-host (VPS HostGator).
# Sobe: caddy (HTTPS) → app (Next standalone) + waha + redis+srh + scheduler.
# Só o Caddy publica portas (80/443). Todo o resto vive na rede interna.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# VARIANTE ORION (VPS com Docker Swarm + Traefik já rodando, ex.: SetupOrion):
# ver PATCH-ORION.md. Nessa variante este arquivo sobe via `docker stack deploy`
# em vez de `docker compose up`, sem o serviço `caddy` (o Traefik já existente
# na VPS assume TLS/roteamento por domínio) e com o `worker` apontando pra uma
# imagem pré-buildada localmente (Swarm não builda).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"     # rotação: evita que o log encha o disco do VPS
    max-file: "3"

x-restart-policy: &default-restart
  # Só tem efeito em `docker stack deploy` (Swarm ignora o `restart:` de compose
  # clássico); em `docker compose up` quem manda é o `restart:` de cada serviço.
  restart_policy:
    condition: any
    delay: 5s

services:
  app:
    # Imagem GENÉRICA pré-buildada: o leigo só puxa (sobe em ~2min, roda em 2GB).
    # Os NEXT_PUBLIC_* reais vêm em RUNTIME (env_file abaixo) — o browser lê via
    # <PublicEnvScript/> e o servidor via lib/env.ts. Não precisa buildar no VPS.
    # Build local (avançado): docker compose -f docker-compose.prod.yml -f docker-compose.build.yml build
    image: ${APP_IMAGE:-ghcr.io/melgarafael/deskcommcrm:latest}
    # `pull_policy` fica FORA daqui de propósito: `docker stack deploy`
    # (variante ORION) rejeita essa chave ("Additional property pull_policy is
    # not allowed"). O `dc pull`/`docker compose ... pull` explícito nos
    # scripts já garante a imagem certa antes do up/deploy nos dois modos.
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    depends_on: [srh, waha]
    healthcheck:
      # Probe TCP puro (node existe na imagem; curl/nc não). NÃO usar /api/v1/health:
      # ele dá 503 se WAHA/Redis caem, o que deixaria o app "unhealthy" e derrubaria
      # o Caddy junto (blackout total por uma dependência secundária).
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks:
      internal: {}
      # Só existe/é usada na variante ORION (ver PATCH-ORION.md); em compose
      # comum sem essa rede externa criada, comente estas 2 linhas + o bloco
      # `janet:` no final do arquivo.
      janet: {}
    deploy:
      <<: *default-restart
      labels:
        # Habilitado só quando o container está na rede JANet do Traefik
        # existente (variante ORION). Sem efeito em `docker compose up` comum
        # (essas labels de deploy.* só são lidas por `docker stack deploy`).
        - "traefik.enable=true"
        - "traefik.docker.network=JANet"
        - "traefik.http.routers.deskcommcrm.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.deskcommcrm.entrypoints=websecure"
        - "traefik.http.routers.deskcommcrm.tls.certresolver=letsencryptresolver"
        # Explícito porque desde o router deskcommcrm-agentrun abaixo há mais de
        # um router Traefik neste container — sem isto o Traefik fica em dúvida
        # de qual service cada router alcança (PATCH-ORION.md).
        - "traefik.http.routers.deskcommcrm.service=deskcommcrm"
        - "traefik.http.services.deskcommcrm.loadbalancer.server.port=3000"
        - "traefik.http.services.deskcommcrm.loadbalancer.passHostHeader=1"
        # Rota do agente de IA aguenta até ~5min de resposta — mesmo motivo do
        # transport read_timeout/write_timeout=320s que o Caddy tinha no Caddyfile.
        - "traefik.http.routers.deskcommcrm-agentrun.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/internal/agents/run`)"
        - "traefik.http.routers.deskcommcrm-agentrun.entrypoints=websecure"
        - "traefik.http.routers.deskcommcrm-agentrun.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.deskcommcrm-agentrun.priority=10"
        - "traefik.http.routers.deskcommcrm-agentrun.service=deskcommcrm-agentrun"
        - "traefik.http.services.deskcommcrm-agentrun.loadbalancer.server.port=3000"
        - "traefik.http.services.deskcommcrm-agentrun.loadbalancer.serversTransport=deskcommcrm-agentrun"
        - "traefik.http.serversTransports.deskcommcrm-agentrun.forwardingTimeouts.dialTimeout=30s"
        - "traefik.http.serversTransports.deskcommcrm-agentrun.forwardingTimeouts.responseHeaderTimeout=330s"
        - "traefik.http.serversTransports.deskcommcrm-agentrun.forwardingTimeouts.idleConnTimeout=330s"


  # Worker 24/7 do agent-engine (fusão Vendaval) — cérebro do agente SDR.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # Variante ORION: Swarm não builda (`docker stack deploy` ignora `build:`),
    # então usamos uma tag pré-buildada localmente ANTES do deploy (ver
    # PATCH-ORION.md — `docker build -f Dockerfile.worker -t
    # deskcommcrm-worker:local .`). Em compose comum, `image:` é ignorado a
    # favor do `build:` acima quando a imagem ainda não existe localmente.
    image: ${WORKER_IMAGE:-deskcommcrm-worker:local}
    # `pull_policy` fica fora — ver comentário equivalente no serviço `app`.
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      # dentro da rede do compose, o WAHA é o serviço 'waha' na porta interna 3000
      WAHA_API_BASE_URL: http://waha:3000
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy: *default-restart
  waha:
    # Core grátis por padrão; troque para devlikeapro/waha-plus via WAHA_IMAGE se
    # precisar de multi-número/retry/S3 (licença paga).
    image: ${WAHA_IMAGE:-devlikeapro/waha}
    restart: unless-stopped
    environment:
      # Prefixo sha512: faz o WAHA HASHEAR o X-Api-Key recebido e comparar com este
      # hash. Sem o prefixo ele compara literal → o app (que manda o plaintext) toma 401.
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: ${WAHA_WEBHOOK_BASE_URL}/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message,message.any,message.ack,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      # WAHA lê WHATSAPP_DEFAULT_ENGINE (NÃO WAHA_DEFAULT_ENGINE — o nome errado
      # fazia cair no default WEBJS, engine com browser que trava/corrompe a sessão
      # quando o WhatsApp Web atualiza; NOWEB é websocket direto, estável e leve).
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "false"    # nunca expor o dashboard num template público
    volumes:
      - waha-data:/app/.sessions          # sessões pareadas (QR) — perder = re-parear
      - waha-media:/app/.media
    logging: *default-logging
    networks: [internal]
    deploy: *default-restart

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # efêmero (rate-limit/debounce)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging
    networks: [internal]
    deploy: *default-restart

  srh:
    # serverless-redis-http: fala o REST do Upstash sobre o redis normal, mantendo
    # o SDK @upstash/redis sem tocar código. Pinar tag (validar encoding base64 — T6).
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on: [redis]
    logging: *default-logging
    networks: [internal]
    deploy: *default-restart

  scheduler:
    # Cron sem docker.sock: alpine + crond interno batendo curl na rede interna.
    # Resolução de 1 min (= paridade com os crons da Vercel).
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [app]
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl tzdata >/dev/null 2>&1
        cat > /etc/crontabs/root <<EOF
        * * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/agent-dispatcher >/dev/null 2>&1
        * * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/followup-flow-worker >/dev/null 2>&1
        * * * * * curl -fsS -m45 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/event-log-drain >/dev/null 2>&1
        * * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/routing-worker >/dev/null 2>&1
        * * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/recover-stuck-messages >/dev/null 2>&1
        */5 * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" "http://app:3000/api/v1/cron/storage-redaction?limit=50" >/dev/null 2>&1
        */5 * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/snooze-watcher >/dev/null 2>&1
        */5 * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/attendant-heartbeat >/dev/null 2>&1
        */15 * * * * curl -fsS -m60 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/risk-watcher >/dev/null 2>&1
        0 12 * * * curl -fsS -m60 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/lgpd-sla-watcher >/dev/null 2>&1
        30 3 * * * curl -fsS -m120 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/kb-conversations-batch >/dev/null 2>&1
        */10 * * * * curl -fsS -m60 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/contact-avatars >/dev/null 2>&1
        EOF
        exec crond -f -l 2
    logging: *default-logging
    networks: [internal]
    deploy: *default-restart

  # Variante ORION: SEM serviço `caddy` — o Traefik já existente nesta VPS
  # (rede JANet, resolver `letsencryptresolver`) faz TLS/roteamento por
  # domínio via as labels do serviço `app` acima. Ver PATCH-ORION.md.
  # No compose vanilla (sem Traefik prévio) este bloco é o `caddy` original —
  # veja `main`/upstream se precisar dele de volta.

volumes:
  waha-data:
  waha-media:

networks:
  internal:
    driver: bridge
  # Rede overlay do Traefik já existente na VPS (Docker Swarm). Só é usada na
  # variante ORION — ver PATCH-ORION.md. Precisa já existir no host (é criada
  # pelo próprio Traefik/SetupOrion, não por este stack).
  janet:
    external: true
    name: JANet
